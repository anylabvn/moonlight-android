name: Stream recovery Android build

on:
  push:
    branches:
      - feat/persistent-stream-auto-recovery
  pull_request:
    branches:
      - moonlight-noir
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK platform and NDK
        run: |
          sdkmanager "platforms;android-36" "ndk;27.0.12077973"
      - name: Full unit test suite (required)
        run: |
          chmod +x gradlew
          ./gradlew :app:testNonRoot_gameDebugUnitTest --no-daemon --stacktrace
      - name: Publish test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-failure-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
      - name: Build non-root debug APK
        run: ./gradlew :app:assembleNonRoot_gameDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artemis-stream-recovery-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
